version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: percona/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    privileged: true
    command:
      - '--web.listen-address=0.0.0.0:9100'
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
