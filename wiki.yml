services:
    mediawiki:
        container_name: wiki
        image: mediawiki
        restart: always
        ports:
        - &quot;8080:80&quot;
        links:
            - db
# volumes:
# - ./LocalSettings.php:/var/www/html/LocalSettings.php
    db:
        container_name: mariadb
        image: mariadb
        restart: always
        environment:
            MARIADB_DATABASE: mediawiki
            MARIADB_USER: wiki
            MARIADB_PASSWORD: WikiP@ssw0rd
            MARIADB_ROOT_PASSWORD: P@ssw0rd
        volumes:
            - db_data:/var/lib/mysql
volumes:
    db_data:
