version: '3'
services:
    web:
        image: php:7.4-apache
        ports:
            - "80:80"
        volumes:
            - ./html:/var/www/html
        links:
            - db
    db:
        image: mysql:5.7
            environment:
                MYSQL_ROOT_PASSWORD: toortoor
                MYSQL_DATABASE: ssa8k
                MYSQL_USER: student
                MYSQL_PASSWORD: toortoor
            volumes:
                - mysql-data:/var/lib/mysql
    volumes:
    mysql-data:
